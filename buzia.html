<!DOCTYPE html>
<html>
<head>
</head>
<body>
<canvas id="plansza_canvas" width="300px" height="200px">
</canvas>
<script>
    let plansza, ry;
    plansza = document.getElementById("plansza_canvas");
    rys = plansza.getContext ("2d" ) ;
    rys.fillStyle = "rgb(0,0,0)";
    rys.fillStyle = "rgb(0, 0, 0)";
    rys.fillRect(0, 0, 400, 200);
    rys.fillStyle = "rgb(255, 0, 0)";
    rys.fillRect(40, 40, 220, 120);
    rys.fillStyle = "rgb(0, 0, 255)";
    rys.fillRect(65, 65, 30, 30);
    rys.fillRect(205, 65, 30, 30);
    rys.fillStyle = "rgb(0, 255, 0)";
    rys.fillRect(130, 120, 40, 10);

</script>
</body> 
</html>
